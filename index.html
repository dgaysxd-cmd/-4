<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки пользователей</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="user-tags">
        
        <!-- Тег 1 -->
        <div class="user-tag">
            <img src="https://i.pravatar.cc/100?img=11" alt="Антон Смирнов" class="user-tag__avatar">
            <span class="user-tag__name">Антон Смирнов</span>
        </div>

        <!-- Тег 2 -->
        <div class="user-tag">
            <img src="https://i.pravatar.cc/100?img=5" alt="Алена" class="user-tag__avatar">
            <span class="user-tag__name">Алена</span>
        </div>

        <!-- Тег 3 -->
        <div class="user-tag">
            <img src="https://i.pravatar.cc/100?img=9" alt="Екатерина Белова" class="user-tag__avatar">
            <span class="user-tag__name">Екатерина Белова</span>
        </div>

        <!-- Тег 4 -->
        <div class="user-tag">
            <img src="https://i.pravatar.cc/100?img=20" alt="Мария" class="user-tag__avatar">
            <span class="user-tag__name">Мария</span>
        </div>

        <!-- Тег 5 -->
        <div class="user-tag">
            <img src="https://i.pravatar.cc/100?img=12" alt="Алексей Иванов" class="user-tag__avatar">
            <span class="user-tag__name">Алексей Иванов</span>
        </div>

    </div>

</body>
</html>
